name: Deploy Slides to GitHub Pages

on:
  push:
    branches:
      - DevOps
    paths:
      - Slides/**
      - .github/workflows/deploy-slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Slides

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Slides/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Slidev site
        run: npm run build -- --base "/${{ github.event.repository.name }}/" --router-mode hash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
