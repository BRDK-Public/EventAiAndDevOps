name: Build Test Release

permissions:
  contents: write

on:
  push:
    tags:
      - '**'

jobs:
  build-test-release:
    runs-on:
      - self-hosted
      - brdk-public

    defaults:
      run:
        working-directory: DevOps/DevOpsDemo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update hardware config version
        shell: pwsh
        run: |
          $tagName = "${env:GITHUB_REF_NAME}"
          $version = if ($tagName -match '^v\.(.+)$') { $matches[1] } else { $tagName }
          $hardwarePath = "Physical/Config1/Hardware.hw"

          [xml]$hardware = Get-Content -Path $hardwarePath
          $ns = New-Object System.Xml.XmlNamespaceManager($hardware.NameTable)
          $ns.AddNamespace("h", $hardware.DocumentElement.NamespaceURI)

          $module = $hardware.SelectSingleNode("//h:Module[@Name='X20CP0484']", $ns)
          if (-not $module) {
            throw "Module X20CP0484 not found in $hardwarePath"
          }

          $parameter = $module.SelectSingleNode("./h:Parameter[@ID='ConfigVersion']", $ns)
          if ($parameter) {
            $parameter.SetAttribute("Value", $version)
          } else {
            $newParameter = $hardware.CreateElement("Parameter", $hardware.DocumentElement.NamespaceURI)
            $newParameter.SetAttribute("ID", "ConfigVersion")
            $newParameter.SetAttribute("Value", $version)
            [void]$module.AppendChild($newParameter)
          }

          $hardware.Save($hardwarePath)
          Write-Host "Updated ConfigVersion to $version from tag $tagName"

      - name: Build
        run: .\as-cli.exe build pip --output ReleaseCandidate

      - name: Test
        run: echo "Test Passed"

      - name: Package Release
        shell: pwsh
        run: |
          $sourceDir = "ReleaseCandidate"
          $tagName = "${env:GITHUB_REF_NAME}"
          $zipName = "Update-$tagName.zip"
          $zipPath = Join-Path $PWD $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $sourceDir "*") -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Check existing release
        id: release_check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setOutput('exists', 'true');
              core.info(`Release already exists for tag ${tag}.`);
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
                core.info(`No release found for tag ${tag}.`);
              } else {
                throw error;
              }
            }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: DevOps/DevOpsDemo/Update-*.zip
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish to FTPserver
        if: startsWith(github.ref, 'refs/tags/') && steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $source = "ReleaseCandidate"
          # Fixed machine path the FTP server serves - NOT the runner's
          # ephemeral _work checkout, so the served files persist between runs.
          $dest = "C:\ReleaseServer\FTPserver"
          $marker = "arnbcfg.xml"

          # Wipe the current FTP root
          if (Test-Path $dest) {
            Get-ChildItem -Path $dest -Force | Remove-Item -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
          }

          # Copy everything EXCEPT the marker file first...
          Get-ChildItem -Path $source -Force | Where-Object { $_.Name -ne $marker } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
          }

          # ...then the marker file LAST, so the PLC only sees the new version
          # once every other file is already in place.
          Copy-Item -Path (Join-Path $source $marker) -Destination $dest -Force
          Write-Host "Published $source -> $dest ($marker copied last)"
