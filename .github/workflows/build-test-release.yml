name: Build Test Release

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on:
      - self-hosted
      - brdk-public

    defaults:
      run:
        working-directory: DevOps/DevOpsDemo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: .\as-cli.exe build pip --output ReleaseCandidate

      - name: Test
        run: echo "Test Passed"

      - name: Package Release
        shell: pwsh
        run: |
          $sourceDir = "ReleaseCandidate"
          $zipPath = Join-Path $PWD "ReleaseCandidate.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $sourceDir "*") -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DevOps/DevOpsDemo/ReleaseCandidate.zip
          fail_on_unmatched_files: true
          overwrite_files: true
